# Local development defaults bind published ports to loopback.
# See README.md for admin profiles, readiness, and Redis topology recovery.
services:
  gateway:
    build:
      context: ./
      dockerfile: ./gateway/Dockerfile
    environment:
      - JAVA_TOOL_OPTIONS=-Xmx512m
      - TRUST_PROXY_HEADERS=true
      - CORS_ALLOWED_HOST=${CORS_ALLOWED_HOST:-}
      - MARKET_SERVICE_URL=http://market-service:8081
      - NEWS_SERVICE_URL=http://news-service:8082
      - REDIS_SENTINEL_HOSTS=redis-sentinel-1:26379,redis-sentinel-2:26379,redis-sentinel-3:26379
      - REDIS_MASTER_NAME=mymaster
      - REDIS_URL=redis://redis:6379
    depends_on:
      - postgres-market
      - postgres-news
      - redis
      - redis-sentinel-1
      - redis-sentinel-2
      - redis-sentinel-3
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - orbital-net

  gateway-lb:
    image: nginx:1.27-alpine
    container_name: orbital-gateway-lb
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./nginx/gateway-lb.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - gateway
    networks:
      - orbital-net

  market-service:
    build:
      context: ./
      dockerfile: ./market-service/Dockerfile
    container_name: orbital-market
    ports:
      - "127.0.0.1:8081:8081"
    environment:
      - JAVA_TOOL_OPTIONS=-Xmx512m
      - DB_URL=jdbc:postgresql://postgres-market:5432/market_data
      - DB_USER=market_user
      - DB_PASSWORD=${POSTGRES_MARKET_PASSWORD:-market_pass}
      - REDIS_URL=redis://redis:6379
      - MARKET_API_KEY=${MARKET_API_KEY}
    depends_on:
      - postgres-market
      - redis
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - orbital-net

  market-ingestor:
    build:
      context: ./
      dockerfile: ./market-service/Dockerfile.ingestor
    container_name: orbital-market-ingestor
    environment:
      - DB_URL=jdbc:postgresql://postgres-market:5432/market_data
      - DB_USER=market_user
      - DB_PASSWORD=${POSTGRES_MARKET_PASSWORD:-market_pass}
      - INGEST_INTERVAL_MS=60000
    depends_on:
      - postgres-market
    restart: unless-stopped
    networks:
      - orbital-net

  news-service:
    build:
      context: ./
      dockerfile: ./news-service/Dockerfile
    container_name: orbital-news
    ports:
      - "127.0.0.1:8082:8082"
    environment:
      - JAVA_TOOL_OPTIONS=-Xmx512m
      - DB_URL=jdbc:postgresql://postgres-news:5432/news_data
      - DB_USER=news_user
      - DB_PASSWORD=${POSTGRES_NEWS_PASSWORD:-news_pass}
      - REDIS_SENTINEL_HOSTS=redis-sentinel-1:26379,redis-sentinel-2:26379,redis-sentinel-3:26379
      - REDIS_MASTER_NAME=mymaster
      - REDIS_URL=redis://redis:6379
      - NEWS_API_KEY=${NEWS_API_KEY}
    depends_on:
      - postgres-news
      - redis
      - redis-sentinel-1
      - redis-sentinel-2
      - redis-sentinel-3
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - orbital-net

  postgres-market:
    image: postgres:15
    container_name: postgres-market
    environment:
      POSTGRES_DB: market_data
      POSTGRES_USER: market_user
      POSTGRES_PASSWORD: ${POSTGRES_MARKET_PASSWORD:-market_pass}
      REPLICATION_USER: replicator
      REPLICATION_PASSWORD: ${POSTGRES_REPLICATION_PASSWORD:-replicator_pass}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_market_data:/var/lib/postgresql/data
      - ./database/market/init:/docker-entrypoint-initdb.d
    networks:
      - orbital-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U market_user -d market_data"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-market-replica:
    image: postgres:15
    container_name: postgres-market-replica
    environment:
      PGDATA: /var/lib/postgresql/data
      PRIMARY_HOST: postgres-market
      REPLICATION_USER: replicator
      REPLICATION_PASSWORD: ${POSTGRES_REPLICATION_PASSWORD:-replicator_pass}
    entrypoint: ["/bin/bash", "/docker-entrypoint-replica.sh"]
    volumes:
      - postgres_market_replica_data:/var/lib/postgresql/data
      - ./database/replica-entrypoint.sh:/docker-entrypoint-replica.sh:ro
    depends_on:
      - postgres-market
    networks:
      - orbital-net

  postgres-news:
    image: postgres:15
    container_name: postgres-news
    environment:
      POSTGRES_DB: news_data
      POSTGRES_USER: news_user
      POSTGRES_PASSWORD: ${POSTGRES_NEWS_PASSWORD:-news_pass}
      REPLICATION_USER: replicator
      REPLICATION_PASSWORD: ${POSTGRES_REPLICATION_PASSWORD:-replicator_pass}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_news_data:/var/lib/postgresql/data
      - ./database/news/init:/docker-entrypoint-initdb.d
    networks:
      - orbital-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U news_user -d news_data"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-news-replica:
    image: postgres:15
    container_name: postgres-news-replica
    environment:
      PGDATA: /var/lib/postgresql/data
      PRIMARY_HOST: postgres-news
      REPLICATION_USER: replicator
      REPLICATION_PASSWORD: ${POSTGRES_REPLICATION_PASSWORD:-replicator_pass}
    entrypoint: ["/bin/bash", "/docker-entrypoint-replica.sh"]
    volumes:
      - postgres_news_replica_data:/var/lib/postgresql/data
      - ./database/replica-entrypoint.sh:/docker-entrypoint-replica.sh:ro
    depends_on:
      - postgres-news
    networks:
      - orbital-net

  redis:
    image: redis:7-alpine
    container_name: redis-cache
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    networks:
      - orbital-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  redis-replica:
    image: redis:7-alpine
    container_name: redis-replica
    command: redis-server --replicaof redis 6379 --appendonly yes
    volumes:
      - redis_replica_data:/data
    depends_on:
      - redis
    networks:
      - orbital-net

  redis-sentinel-1:
    image: redis:7-alpine
    container_name: redis-sentinel-1
    command: sh /sentinel-entrypoint.sh
    volumes:
      - ./redis/sentinel-1.conf:/seed/sentinel.conf:ro
      - ./redis/sentinel-entrypoint.sh:/sentinel-entrypoint.sh:ro
      - sentinel_1_data:/data
    depends_on:
      - redis
      - redis-replica
    networks:
      - orbital-net

  redis-sentinel-2:
    image: redis:7-alpine
    container_name: redis-sentinel-2
    command: sh /sentinel-entrypoint.sh
    volumes:
      - ./redis/sentinel-2.conf:/seed/sentinel.conf:ro
      - ./redis/sentinel-entrypoint.sh:/sentinel-entrypoint.sh:ro
      - sentinel_2_data:/data
    depends_on:
      - redis
      - redis-replica
    networks:
      - orbital-net

  redis-sentinel-3:
    image: redis:7-alpine
    container_name: redis-sentinel-3
    command: sh /sentinel-entrypoint.sh
    volumes:
      - ./redis/sentinel-3.conf:/seed/sentinel.conf:ro
      - ./redis/sentinel-entrypoint.sh:/sentinel-entrypoint.sh:ro
      - sentinel_3_data:/data
    depends_on:
      - redis
      - redis-replica
    networks:
      - orbital-net

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    networks:
      - orbital-net

  grafana:
    image: grafana/grafana:latest
    profiles: [admin]
    container_name: grafana
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources
    depends_on:
      - prometheus
    networks:
      - orbital-net

  pgadmin:
    profiles: [admin]
    image: dpage/pgadmin4
    depends_on:
      - postgres-market
      - postgres-news
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@local.com
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_ADMIN_PASSWORD:-admin}
    ports:
      - "127.0.0.1:5050:80"
    restart: unless-stopped
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - orbital-net


volumes:
  sentinel_1_data:
  sentinel_2_data:
  sentinel_3_data:
  postgres_market_data:
  postgres_market_replica_data:
  postgres_news_data:
  postgres_news_replica_data:
  redis_data:
  redis_replica_data:
  prometheus_data:
  grafana_data:
  pgadmin_data:

networks:
  orbital-net:
    driver: bridge
