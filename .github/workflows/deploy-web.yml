name: Deploy Web

on:
  release:
    types: [ published ]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build wasmJs distribution (market-only demo, no backend — see docs/superpowers/plans/2026-10-02-coingecko-demo-web.md)
        run: ./gradlew :orbital-app:wasmJsBrowserDistribution -PorbitalDemoBuild=true

      - name: Build API docs
        run: ./gradlew dokkaHtmlMultiModule

      - name: Assemble Pages site
        run: |
          mkdir -p site/docs
          cp -r orbital-app/build/dist/wasmJs/productionExecutable/. site/
          cp -r build/dokka/htmlMultiModule/. site/docs/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
