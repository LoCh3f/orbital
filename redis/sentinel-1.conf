# Identical across sentinel-1/2/3.conf on purpose: each Sentinel needs its own writable file
# (Sentinel rewrites it at runtime with the master's current state), so a single shared file
# mounted into three containers would have them fight over writes to the same inode.
port 26379
# Both must come before `sentinel monitor`: Sentinel resolves that line's hostname immediately
# at parse time, and resolve-hostnames defaults to "no" (expects a literal IP), which is why
# `redis` as a Docker service name failed with "Can't resolve instance hostname" until this was
# added. announce-hostnames keeps Sentinel reporting `redis`/`redis-replica` by name to other
# Sentinels/clients too, instead of a container IP that changes on restart.
sentinel resolve-hostnames yes
sentinel announce-hostnames yes
sentinel monitor mymaster redis 6379 2
sentinel down-after-milliseconds mymaster 5000
sentinel failover-timeout mymaster 10000
sentinel parallel-syncs mymaster 1
