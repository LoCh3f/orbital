name: Test & Lint

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Test & lint
      run: ./gradlew check

    - name: Upload test & lint reports
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: test-reports
        path: |
          */build/reports/tests/
          */build/reports/detekt/

  postgres-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: orbital_test
          POSTGRES_PASSWORD: ci-test-only
          POSTGRES_DB: orbital_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U orbital_test -d orbital_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_POSTGRES_URL: jdbc:postgresql://localhost:5432/orbital_test?user=orbital_test&password=ci-test-only
      TEST_DB_USER: orbital_test
      TEST_DB_PASSWORD: ci-test-only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew --no-build-cache --rerun-tasks :market-service:test :news-service:test --tests '*RepositoryTest'
