name: Docker Build & Push

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'gateway/**'
      - 'market-service/**'
      - 'news-service/**'
      - 'libs/**'
      - 'docker-compose.yml'
      - '.github/workflows/docker-build.yml'

jobs:
  docker:
    runs-on: ubuntu-latest
    
    permissions:
      contents: read
      packages: write

    steps:
    - uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata for gateway
      id: meta-gateway
      uses: docker/metadata-action@v5
      with:
        images: ghcr.io/${{ github.repository }}/gateway
        tags: |
          type=ref,event=branch
          type=sha,prefix={{branch}}-
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=raw,value=latest,enable={{is_default_branch}}

    - name: Build and push gateway
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./gateway/Dockerfile
        push: true
        tags: ${{ steps.meta-gateway.outputs.tags }}
        labels: ${{ steps.meta-gateway.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Extract metadata for market-service
      id: meta-market
      uses: docker/metadata-action@v5
      with:
        images: ghcr.io/${{ github.repository }}/market-service
        tags: |
          type=ref,event=branch
          type=sha,prefix={{branch}}-
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=raw,value=latest,enable={{is_default_branch}}

    - name: Build and push market-service
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./market-service/Dockerfile
        push: true
        tags: ${{ steps.meta-market.outputs.tags }}
        labels: ${{ steps.meta-market.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Extract metadata for news-service
      id: meta-news
      uses: docker/metadata-action@v5
      with:
        images: ghcr.io/${{ github.repository }}/news-service
        tags: |
          type=ref,event=branch
          type=sha,prefix={{branch}}-
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=raw,value=latest,enable={{is_default_branch}}

    - name: Build and push news-service
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./news-service/Dockerfile
        push: true
        tags: ${{ steps.meta-news.outputs.tags }}
        labels: ${{ steps.meta-news.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
