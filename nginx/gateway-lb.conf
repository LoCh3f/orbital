# UNVERIFIED — drafted without a Docker daemon to test against. Review before relying on it.
#
# Fronts however many `gateway` replicas are running (`docker compose up --scale gateway=3 -d`).
# The `set $upstream ...; proxy_pass $upstream;` indirection is deliberate, not style: a bare
# `proxy_pass http://gateway:8080;` resolves the hostname once, at nginx startup, and caches it
# forever — new or replaced replica IPs would never be picked up without an nginx restart. Routing
# through a variable forces nginx to re-resolve via the `resolver` directive (Docker's embedded
# DNS at 127.0.0.11) on each request, so it sees replicas as they come and go.
#
# Caveat: Docker's embedded DNS round-robins which replica IP it hands back per lookup, which is a
# coarser load-balancing guarantee than a real service mesh (Traefik with the Docker provider, or
# Swarm's virtual IP) gives you — fine for a draft, worth upgrading if this becomes load-bearing.
events {}

http {
  resolver 127.0.0.11 valid=10s;

  server {
    listen 8080;

    location / {
      set $upstream_gateway http://gateway:8080;
      proxy_pass $upstream_gateway;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}
